[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "comp-ranker"
version = "0.1.0"
description = "Learning-to-rank for comparable commercial-real-estate properties."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Niles Liu" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
interpret = ["shap>=0.44"]

[tool.setuptools.packages.find]
where = ["src"]
